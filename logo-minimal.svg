<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="minimalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sol minimalista -->
  <circle cx="50" cy="35" r="15" fill="url(#minimalGradient)"/>

  <!-- Rayos esenciales -->
  <g fill="url(#minimalGradient)">
    <path d="M35,20 L40,25 L30,25 L35,20 Z"/>
    <path d="M65,20 L70,25 L60,25 L65,20 Z"/>
    <path d="M20,35 L25,35 L25,40 L20,35 Z"/>
    <path d="M80,35 L85,35 L85,40 L80,35 Z"/>
    <path d="M35,50 L40,55 L30,55 L35,50 Z"/>
    <path d="M65,50 L70,55 L60,55 L65,50 Z"/>
  </g>

  <!-- Ondas simples -->
  <g fill="url(#minimalGradient)" opacity="0.6">
    <path d="M20,65 Q35,55 50,65 T80,65"/>
    <path d="M15,75 Q30,70 45,75 T75,75"/>
  </g>
</svg>