<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="socialGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="socialWaves" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.6" />
    </linearGradient>
    <filter id="socialGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo circular sutil -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#socialGradient)" stroke-width="2" opacity="0.1"/>

  <!-- Sol/Medio Sol -->
  <g transform="translate(200, 160)">
    <!-- Rayos superiores -->
    <g fill="url(#socialGradient)" filter="url(#socialGlow)">
      <!-- Rayos principales -->
      <path d="M-120,-80 L-90,-70 L-70,-100 L-50,-70 L-20,-80 L-30,-50 L-60,-60 L-90,-50 L-120,-80 Z"/>
      <path d="M20,-80 L50,-70 L70,-100 L90,-70 L120,-80 L90,-50 L60,-60 L30,-50 L20,-80 Z"/>

      <!-- Rayos medios superiores -->
      <path d="M-100,-40 L-70,-30 L-50,-60 L-30,-30 L0,-40 L-15,-10 L-40,-20 L-70,-10 L-100,-40 Z"/>
      <path d="M0,-40 L30,-30 L50,-60 L70,-30 L100,-40 L70,-10 L40,-20 L15,-10 L0,-40 Z"/>

      <!-- Rayos inferiores -->
      <path d="M-80,0 L-50,10 L-30,-20 L-10,10 L20,0 L10,30 L-20,20 L-50,30 L-80,0 Z"/>
      <path d="M20,0 L50,10 L70,-20 L90,10 L120,0 L90,30 L60,20 L30,30 L20,0 Z"/>
    </g>

    <!-- Círculo central del sol -->
    <circle cx="0" cy="-40" r="50" fill="url(#socialGradient)" filter="url(#socialGlow)"/>
    <circle cx="0" cy="-40" r="30" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Ondas inferiores -->
  <g transform="translate(200, 280)">
    <g fill="url(#socialWaves)" opacity="0.7">
      <!-- Onda principal -->
      <path d="M-160,0 Q-120,-30 -80,0 T0,0 T80,0 T120,-30 T160,0" stroke="url(#socialWaves)" stroke-width="4" fill="none"/>

      <!-- Onda secundaria -->
      <path d="M-140,20 Q-100,-10 -60,20 T20,20 T60,20 T100,-10 T140,20" stroke="url(#socialWaves)" stroke-width="3" fill="none" opacity="0.6"/>

      <!-- Onda terciaria -->
      <path d="M-120,40 Q-80,10 -40,40 T40,40 T80,40 T120,10 T160,40" stroke="url(#socialWaves)" stroke-width="2" fill="none" opacity="0.4"/>
    </g>
  </g>
</svg>