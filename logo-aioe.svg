<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sunGradientAIOE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wavesGradientAIOE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glowAIOE">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sol/Medio Sol -->
  <g transform="translate(100, 80)">
    <!-- Rayos superiores -->
    <g fill="url(#sunGradientAIOE)" filter="url(#glowAIOE)">
      <!-- Rayos principales -->
      <path d="M-60,-40 L-45,-35 L-35,-50 L-25,-35 L-10,-40 L-15,-25 L-30,-30 L-45,-25 L-60,-40 Z"/>
      <path d="M10,-40 L25,-35 L35,-50 L45,-35 L60,-40 L45,-25 L30,-30 L15,-25 L10,-40 Z"/>

      <!-- Rayos medios superiores -->
      <path d="M-50,-20 L-35,-15 L-25,-30 L-15,-15 L0,-20 L-5,-5 L-20,-10 L-35,-5 L-50,-20 Z"/>
      <path d="M0,-20 L15,-15 L25,-30 L35,-15 L50,-20 L35,-5 L20,-10 L5,-5 L0,-20 Z"/>

      <!-- Rayos inferiores -->
      <path d="M-40,0 L-25,5 L-15,-10 L-5,5 L10,0 L5,15 L-10,10 L-25,15 L-40,0 Z"/>
      <path d="M10,0 L25,5 L35,-10 L45,5 L60,0 L45,15 L30,10 L15,15 L10,0 Z"/>
    </g>

    <!-- Círculo central del sol -->
    <circle cx="0" cy="-20" r="25" fill="url(#sunGradientAIOE)" filter="url(#glowAIOE)"/>
    <circle cx="0" cy="-20" r="15" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Ondas inferiores -->
  <g transform="translate(100, 140)">
    <g fill="url(#wavesGradientAIOE)" opacity="0.7">
      <!-- Onda principal -->
      <path d="M-80,0 Q-60,-15 -40,0 T0,0 T40,0 T60,-15 T80,0" stroke="url(#wavesGradientAIOE)" stroke-width="3" fill="none"/>

      <!-- Onda secundaria -->
      <path d="M-70,10 Q-50,-5 -30,10 T10,10 T30,10 T50,-5 T70,10" stroke="url(#wavesGradientAIOE)" stroke-width="2" fill="none" opacity="0.6"/>

      <!-- Onda terciaria -->
      <path d="M-60,20 Q-40,5 -20,20 T20,20 T40,20 T60,5 T80,20" stroke="url(#wavesGradientAIOE)" stroke-width="1.5" fill="none" opacity="0.4"/>
    </g>
  </g>
</svg>